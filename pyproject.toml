[project]
name = "unihap"
version = "0.1.0"
description = "UniHAP — Enterprise Product Intelligence & Attribute Enrichment Pipeline (12-layer evidence-grounded architecture)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Mani Joshi", email = "manijoshi@example.com" }
]
keywords = [
    "product-intelligence",
    "attribute-enrichment",
    "ecommerce-catalog",
    "crawl4ai",
    "groq",
    "firecrawl",
    "wikidata",
    "knowledge-graph",
    "pydantic",
    "streamlit"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business"
]

dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.9.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.9.0",
    "networkx>=3.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "crawl4ai>=0.3.0",
    "firecrawl-py>=1.0.0",
    "streamlit>=1.35.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.2",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[project.scripts]
unihap = "unihap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unihap"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
